
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Navigation</title>

    <style>

        /* =========================
           1. Universal Selector
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           2. Element Selector
           ========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }


        /* =========================
           3. Navigation
           ========================= */

        nav {
            background-color: #172554;

            /* Position */
            position: sticky;
            top: 0;
            z-index: 1000;

            /* Box Model */
            padding: 15px 40px;

            /* Display */
            display: flex;

            /* Flexbox */
            justify-content: space-between;
            align-items: center;
        }


        /* =========================
           4. Class Selector
           ========================= */

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
        }


        /* =========================
           Navigation List
           ========================= */

        .nav-links {
            list-style: none;

            /* Flexbox */
            display: flex;
            gap: 25px;
        }


        /* =========================
           Descendant Selector
           ========================= */

        .nav-links a {
            color: white;
            text-decoration: none;

            font-size: 16px;
            font-weight: 500;

            /* Box Model */
            padding: 10px 12px;

            /* Display */
            display: block;

            transition: 0.3s;
        }


        /* =========================
           Pseudo-class Selector
           ========================= */

        .nav-links a:hover {
            background-color: #2563eb;
            border-radius: 6px;
        }


        /* =========================
           Button
           ========================= */

        .menu-btn {
            display: none;

            background-color: #2563eb;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 8px 12px;

            font-size: 22px;
            cursor: pointer;
        }


        /* =========================
           Hero Section
           ========================= */

        .hero {
            min-height: 90vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 40px;
        }


        .hero-content {
            max-width: 700px;
        }


        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
            color: #172554;
        }


        .hero p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }


        /* =========================
           Responsive Design
           ========================= */

        @media (max-width: 768px) {

            nav {
                padding: 15px 20px;
            }

            /* Hide normal menu */

            .nav-links {
                display: none;

                /* Position */
                position: absolute;

                top: 65px;
                left: 0;

                width: 100%;

                background-color: #172554;

                /* Flexbox */
                flex-direction: column;

                gap: 0;

                padding: 10px 0;
            }


            .nav-links.active {
                display: flex;
            }


            .nav-links a {
                text-align: center;
                padding: 15px;
            }


            /* Show menu button */

            .menu-btn {
                display: block;
            }


            .hero h1 {
                font-size: 32px;
            }


            .hero p {
                font-size: 16px;
            }
        }

    </style>
</head>


<body>


    <!-- Navigation -->

    <nav>

        <a href="#" class="logo">
            Shailesh
        </a>


        <button class="menu-btn" onclick="toggleMenu()">
            ☰
        </button>


        <ul class="nav-links" id="navLinks">

            <li>
                <a href="#home">Home</a>
            </li>

            <li>
                <a href="#about">About</a>
            </li>

            <li>
                <a href="#skills">Skills</a>
            </li>

            <li>
                <a href="#projects">Projects</a>
            </li>

            <li>
                <a href="#contact">Contact</a>
            </li>

        </ul>

    </nav>


    <!-- Hero Section -->

    <section class="hero" id="home">

        <div class="hero-content">

            <h1>
                Welcome to My Portfolio
            </h1>

            <p>
                PHP Developer | Laravel Developer | Full Stack Developer
            </p>

        </div>

    </section>


    <!-- JavaScript -->

    <script>

        function toggleMenu() {

            const navLinks = document.getElementById("navLinks");

            navLinks.classList.toggle("active");

        }

    </script>


</body>
</html>
