
<!DOCTYPE html>

    <title>JavaScript From Scratch</title>
</head>

<body>

    <h1>JavaScript From Scratch</h1>

    <p>
        Open Browser Console:
        <strong>F12 → Console</strong>
    </p>

    <p>
        We are learning:
        Variables → Data Types → Operators → Logic
    </p>


    <!-- =====================================================
         HOW TO RUN JAVASCRIPT
         =====================================================

         Method 1:
         Put JavaScript inside <script>...</script>

         Method 2:
         Create a separate file:
         script.js

         Then connect it using:
         <script src="script.js"></script>

         Method 3:
         Open Browser → F12 → Console
         Then directly type JavaScript.

         Example:
         console.log("Hello JavaScript");
    -->


    <script>

        // =====================================================
        // 1. YOUR FIRST JAVASCRIPT PROGRAM
        // =====================================================

        console.log("Hello JavaScript!");

        // console.log() is used to display output
        // in the browser console.


        // =====================================================
        // 2. COMMENTS IN JAVASCRIPT
        // =====================================================

        // This is a single-line comment.

        /*
            This is a
            multi-line comment.
        */

        console.log("Comments are ignored by JavaScript.");


        // =====================================================
        // 3. VARIABLES
        // =====================================================

        /*
            A variable is a container used to store data.

            Example:

            let name = "Shailesh";

            name = variable
            "Shailesh" = value
        */


        // -----------------------------------------------------
        // let
        // -----------------------------------------------------

        let name = "Shailesh";

        console.log(name);

        // We can change the value of a let variable.

        name = "Rahul";

        console.log(name);


        // -----------------------------------------------------
        // const
        // -----------------------------------------------------

        const country = "India";

        console.log(country);

        // const cannot be reassigned.

        // country = "USA"; // ERROR


        // -----------------------------------------------------
        // var
        // -----------------------------------------------------

        var age = 23;

        console.log(age);

        // var is an older way of declaring variables.
        // For modern JavaScript, prefer let and const.


        // =====================================================
        // 4. VARIABLE NAMING RULES
        // =====================================================

        let firstName = "Shailesh";
        let studentAge = 23;
        let _username = "gondshailesh";
        let $price = 100;

        // Valid variable names:
        // firstName
        // studentAge
        // _username
        // $price

        // Invalid:
        // let 1name = "Shailesh";
        // let first-name = "Shailesh";

        // JavaScript is case-sensitive.

        let city = "Nanded";

        // city and City are different variables.

        let City = "Pune";


        // =====================================================
        // 5. DATA TYPES
        // =====================================================

        /*
            JavaScript has several data types.

            Main beginner data types:

            1. String
            2. Number
            3. Boolean
            4. Undefined
            5. Null
            6. Object
            7. Array
        */


        // -----------------------------------------------------
        // STRING
        // -----------------------------------------------------

        let first = "Shailesh";

        let message = 'Hello';

        console.log(first);
        console.log(message);

        // String means text.


        // -----------------------------------------------------
        // NUMBER
        // -----------------------------------------------------

        let marks = 75;
        let salary = 25000;
        let percentage = 63.97;

        console.log(marks);
        console.log(salary);
        console.log(percentage);

        // JavaScript has one main Number type
        // for integers and decimal numbers.


        // -----------------------------------------------------
        // BOOLEAN
        // -----------------------------------------------------

        let isStudent = true;

        let isLoggedIn = false;

        console.log(isStudent);
        console.log(isLoggedIn);

        // Boolean has only two values:
        // true
        // false


        // -----------------------------------------------------
        // UNDEFINED
        // -----------------------------------------------------

        let address;

        console.log(address);

        // A variable declared without a value
        // has the value undefined.


        // -----------------------------------------------------
        // NULL
        // -----------------------------------------------------

        let phoneNumber = null;

        console.log(phoneNumber);

        // null means intentionally empty/no value.


        // -----------------------------------------------------
        // ARRAY
        // -----------------------------------------------------

        let skills = [
            "HTML",
            "CSS",
            "JavaScript",
            "PHP",
            "Laravel"
        ];

        console.log(skills);

        // Array stores multiple values.


        // -----------------------------------------------------
        // OBJECT
        // -----------------------------------------------------

        let student = {
            name: "Shailesh",
            age: 23,
            course: "MCA"
        };

        console.log(student);

        // Object stores data in key-value pairs.


        // =====================================================
        // 6. typeof OPERATOR
        // =====================================================

        console.log(typeof "Hello");
        console.log(typeof 100);
        console.log(typeof true);
        console.log(typeof undefined);
        console.log(typeof null);

        // typeof tells us the type of a value.


        // =====================================================
        // 7. ARITHMETIC OPERATORS
        // =====================================================

        let a = 20;
        let b = 10;

        // Addition
        console.log(a + b); // 30

        // Subtraction
        console.log(a - b); // 10

        // Multiplication
        console.log(a * b); // 200

        // Division
        console.log(a / b); // 2

        // Remainder
        console.log(a % b); // 0

        // Power
        console.log(a ** 2); // 400


        // =====================================================
        // 8. ASSIGNMENT OPERATORS
        // =====================================================

        let number = 10;

        // Assignment
        number = 20;

        // Add and assign
        number += 5;

        // Same as:
        // number = number + 5;

        console.log(number);


        // Subtract and assign
        number -= 5;

        // Same as:
        // number = number - 5;


        // Multiply and assign
        number *= 2;

        // Same as:
        // number = number * 2;


        // Divide and assign
        number /= 2;

        // Same as:
        // number = number / 2;


        // =====================================================
        // 9. COMPARISON OPERATORS
        // =====================================================

        let x = 10;
        let y = 20;

        console.log(x == y);   // false

        console.log(x != y);   // true

        console.log(x > y);    // false

        console.log(x < y);    // true

        console.log(x >= y);   // false

        console.log(x <= y);   // true


        // =====================================================
        // 10. == VS ===
        // =====================================================

        /*
            == checks value after type conversion.

            === checks BOTH:
            value AND data type.

            Prefer === in modern JavaScript.
        */

        console.log(10 == "10");   // true

        console.log(10 === "10");  // false


        // =====================================================
        // 11. LOGICAL OPERATORS
        // =====================================================

        /*
            &&  AND
            ||  OR
            !   NOT
        */


        // AND

        console.log(true && true);   // true
        console.log(true && false);  // false


        // OR

        console.log(true || false);  // true
        console.log(false || false); // false


        // NOT

        console.log(!true);  // false
        console.log(!false); // true


        // =====================================================
        // 12. STRING CONCATENATION
        // =====================================================

        let firstName2 = "Shailesh";
        let lastName = "Gond";

        let fullName = firstName2 + " " + lastName;

        console.log(fullName);


        // =====================================================
        // 13. TEMPLATE LITERALS
        // =====================================================

        let personName = "Shailesh";
        let personAge = 23;

        console.log(`My name is ${personName}`);
        console.log(`I am ${personAge} years old.`);

        // Template literals use backticks ` `


        // =====================================================
        // 14. SIMPLE CALCULATOR
        // =====================================================

        let num1 = 50;
        let num2 = 10;

        console.log("Addition:", num1 + num2);
        console.log("Subtraction:", num1 - num2);
        console.log("Multiplication:", num1 * num2);
        console.log("Division:", num1 / num2);
        console.log("Remainder:", num1 % num2);


        // =====================================================
        // 15. PRACTICE EXERCISE 1

        // =====================================================

        /*

        */

        // TRY YOURSELF HERE


        // =====================================================

        // =====================================================

        /*

            What will be printed?

        */

        // Answer:
        // 15

        // 5


        // =====================================================
        // 22. LOGIC BUILDING QUESTION 1
        // =====================================================

        /*
            You have:

            Formula:

        */

        // TRY YOURSELF


        // =====================================================
        // 23. LOGIC BUILDING QUESTION 2
        // =====================================================

        /*

        */

        // TRY YOURSELF


        // =====================================================
        // 24. LOGIC BUILDING QUESTION 3
        // =====================================================

        /*

            let totalBill = 1200;

        */

        // TRY YOURSELF


        // =====================================================
        // 25. LOGIC BUILDING QUESTION 4
        // =====================================================

        /*
            Convert hours into minutes.

            Example:

            hours = 3

            Formula:

            minutes = hours × 60

            Expected:

            180
        */

        // TRY YOURSELF


        // =====================================================

        /*
            Convert minutes into seconds.

        // TRY YOURSELF

        // =====================================================

        /*

        */

        // TRY YOURSELF

        // =====================================================

        /*
            Check whether two numbers are equal.

        */

        // TRY YOURSELF

        // =====================================================

        /*

        */

        /*
