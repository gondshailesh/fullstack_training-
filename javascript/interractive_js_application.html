

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Expense Tracker</title>
    <style>
        
/* General styling */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #1e293b;
    line-height: 1.5;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 28px;
}

.header p,
.card p {
    color: #64748b;
    font-size: 14px;
}

/* Dashboard cards */
.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 22px;
}

.card,
.panel {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 3px 12px #0f172a08;
}

.card h2 {
    margin-top: 10px;
    font-size: 26px;
    overflow-wrap: anywhere;
}

.green {
    color: #059669;
}

.red {
    color: #e11d48;
}

/* Main layout */
.main-layout {
    display: grid;
    grid-template-columns: 0.85fr 1.5fr;
    gap: 20px;
    align-items: start;
}

.right-column {
    display: grid;
    gap: 20px;
}

.panel h2 {
    font-size: 19px;
    margin-bottom: 18px;
}

/* Form */
form {
    display: grid;
    gap: 9px;
}

label {
    font-size: 13px;
    font-weight: bold;
    color: #475569;
    margin-top: 5px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    background: white;
    color: #1e293b;
}

input:focus,
select:focus {
    outline: 2px solid #c7d2fe;
    border-color: #6366f1;
}

.btn {
    padding: 11px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 7px;
}

.btn-primary {
    background: #4f46e5;
    color: white;
}

.btn-primary:hover {
    background: #4338ca;
}

.btn-secondary {
    background: #e2e8f0;
    color: #334155;
}

.btn-secondary:hover {
    background: #cbd5e1;
}

.hidden {
    display: none;
}

#message {
    font-size: 13px;
    color: #4f46e5;
}

/* Filters and tabs */
.filters {
    display: grid;
    grid-template-columns: 1fr 0.8fr;
    gap: 9px;
    margin-bottom: 14px;
}

.tabs {
    display: flex;
    gap: 7px;
    margin-bottom: 10px;
}

.tab {
    border: none;
    border-radius: 8px;
    padding: 9px 13px;
    background: transparent;
    color: #64748b;
    cursor: pointer;
}

.tab.active {
    background: #eef2ff;
    color: #4338ca;
    font-weight: bold;
}

/* Transaction rows */
.transaction {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid #edf0f4;
}

.transaction:last-child {
    border-bottom: none;
}

.transaction-info {
    min-width: 0;
}

.transaction-info h3 {
    font-size: 14px;
    overflow-wrap: anywhere;
}

.transaction-info p {
    font-size: 12px;
    color: #64748b;
    margin-top: 4px;
}

.transaction-right {
    text-align: right;
    flex-shrink: 0;
}

.transaction-amount {
    font-size: 14px;
    font-weight: bold;
}

.actions {
    display: flex;
    gap: 6px;
    margin-top: 7px;
}

.actions button {
    border: none;
    padding: 6px 9px;
    border-radius: 6px;
    cursor: pointer;
    background: #f1f5f9;
    color: #334155;
    font-size: 12px;
}

.actions button:hover {
    background: #e2e8f0;
}

/* Spending breakdown */
.breakdown-item {
    margin-bottom: 17px;
}

.breakdown-heading {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    margin-bottom: 8px;
}

.bar {
    background: #e9edf5;
    height: 8px;
    border-radius: 20px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    background: #6366f1;
    border-radius: 20px;
}

.percentage {
    color: #64748b;
    font-size: 12px;
    margin-top: 5px;
}

.empty {
    text-align: center;
    padding: 25px 5px;
    color: #94a3b8;
    font-size: 14px;
}

footer {
    text-align: center;
    margin-top: 25px;
    color: #94a3b8;
    font-size: 12px;
}

/* Mobile responsive layout */
@media (max-width: 720px) {
    .container {
        padding: 14px;
    }

    .header h1 {
        font-size: 22px;
    }

    .dashboard {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .card,
    .panel {
        padding: 15px;
    }

    .card h2 {
        font-size: 23px;
    }

    .main-layout {
        grid-template-columns: 1fr;
    }

    .filters {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 380px) {
    .header {
        align-items: flex-start;
    }

    .header .btn {
        font-size: 12px;
        padding: 9px;
    }

    .transaction {
        gap: 6px;
    }
}

    </style>

</head>
<body>

    <div class="container">
        <header class="header">
            <div>
                <h1>💰 SpendWise</h1>
                <p>Manage your money smartly</p>
            </div>
            <button id="exportBtn" class="btn btn-secondary">
                Export CSV
            </button>
        </header>

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card">
                <p>Total Balance</p>
                <h2 id="balance">₹0.00</h2>
            </div>

            <div class="card">
                <p>Total Income</p>
                <h2 id="income" class="green">₹0.00</h2>
            </div>

            <div class="card">
                <p>Total Expenses</p>
                <h2 id="expenses" class="red">₹0.00</h2>
            </div>
        </section>

        <main class="main-layout">

            <!-- Transaction Form -->
            <section class="panel">
                <h2 id="formTitle">Add Transaction</h2>

                <form id="transactionForm">
                    <input type="hidden" id="transactionId">

                    <label for="type">Transaction Type</label>
                    <select id="type">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>

                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Lunch, Salary"
                        maxlength="90"
                        required
                    >

                    <label for="amount">Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        max="1000000000"
                        step="0.01"
                        required
                    >

                    <label for="category">Category</label>
                    <select id="category"></select>

                    <label for="date">Date</label>
                    <input type="date" id="date" required>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        + Add Transaction
                    </button>

                    <button type="button" id="cancelBtn"
                        class="btn btn-secondary hidden">
                        Cancel Editing
                    </button>

                    <p id="message" role="status"></p>
                </form>
            </section>

            <div class="right-column">

                <!-- Spending Breakdown -->
                <section class="panel">
                    <h2>Spending Breakdown</h2>
                    <div id="breakdown">
                        <p class="empty">Add an expense to see your report.</p>
                    </div>
                </section>

                <!-- Transaction History -->
                <section class="panel">
                    <h2>Transaction History</h2>

                    <div class="filters">
                        <input
                            type="search"
                            id="search"
                            placeholder="Search transactions..."
                        >

                        <select id="categoryFilter">
                            <option value="all">All Categories</option>
                        </select>
                    </div>

                    <div class="tabs">
                        <button class="tab active" data-type="all">All</button>
                        <button class="tab" data-type="expense">Expenses</button>
                        <button class="tab" data-type="income">Income</button>
                    </div>

                    <div id="transactionList"></div>
                </section>
            </div>
        </main>

        <footer>
            SpendWise · Track your money, achieve your goals.
        </footer>
    </div>

    <script>
        
"use strict";

// =====================================
// 1. GET HTML ELEMENTS
// =====================================

const form = document.getElementById("transactionForm");
const typeInput = document.getElementById("type");
const descriptionInput = document.getElementById("description");
const amountInput = document.getElementById("amount");
const categoryInput = document.getElementById("category");
const dateInput = document.getElementById("date");
const transactionIdInput = document.getElementById("transactionId");

const balanceElement = document.getElementById("balance");
const incomeElement = document.getElementById("income");
const expensesElement = document.getElementById("expenses");
const transactionList = document.getElementById("transactionList");
const breakdownElement = document.getElementById("breakdown");

const searchInput = document.getElementById("search");
const categoryFilter = document.getElementById("categoryFilter");
const submitBtn = document.getElementById("submitBtn");
const cancelBtn = document.getElementById("cancelBtn");
const messageElement = document.getElementById("message");


// =====================================
// 2. APPLICATION DATA
// =====================================

const STORAGE_KEY = "spendwise_transactions_v1";

const categories = [
    "Food",
    "Transport",
    "Shopping",
    "Bills",
    "Health",
    "Education",
    "Entertainment",
    "Salary",
    "Freelance",
    "Investment",
    "Other"
];

const categoryIcons = {
    Food: "🍔",
    Transport: "🚌",
    Shopping: "🛍️",
    Bills: "🧾",
    Health: "💊",
    Education: "📚",
    Entertainment: "🎬",
    Salary: "💼",
    Freelance: "💻",
    Investment: "📈",
    Other: "📌"
};

let transactions = [];
let activeTab = "all";


// =====================================
// 3. HELPER FUNCTIONS
// =====================================

// Get today's date in YYYY-MM-DD format.
function getToday() {
    const today = new Date();

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

// Format numbers as Indian rupees.
function formatCurrency(amount) {
    return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
    }).format(amount);
}

// Safely display user-provided text in HTML.
function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

// Generate a unique transaction ID.
function generateId() {
    if (crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2);
}


// =====================================
// 4. LOAD AND SAVE DATA
// =====================================

// Load saved transactions from the browser.
function loadTransactions() {
    try {
        const savedData = localStorage.getItem(STORAGE_KEY);

        if (!savedData) {
            transactions = [];
            return;
        }

        const parsedData = JSON.parse(savedData);

        if (!Array.isArray(parsedData)) {
            throw new Error("Invalid saved data");
        }

        // Validate records before using them.
        transactions = parsedData.filter(item =>
            item &&
            typeof item.id === "string" &&
            typeof item.description === "string" &&
            typeof item.category === "string" &&
            typeof item.date === "string" &&
            Number.isFinite(item.amount) &&
            item.amount > 0 &&
            ["income", "expense"].includes(item.type) &&
            categories.includes(item.category)
        );
    } catch (error) {
        transactions = [];
        messageElement.textContent =
            "Could not read saved data. Check your browser storage.";
    }
}

// Save transactions in localStorage.
function saveTransactions() {
    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(transactions)
        );

        return true;
    } catch (error) {
        messageElement.textContent =
            "Could not save data. Export a backup and check browser storage.";

        return false;
    }
}


// =====================================
// 5. INITIALIZE CATEGORY DROPDOWNS
// =====================================

function initializeCategories() {
    categoryInput.innerHTML = categories.map(category =>
        `<option value="${category}">${category}</option>`
    ).join("");

    categoryFilter.innerHTML =
        '<option value="all">All Categories</option>' +
        categories.map(category =>
            `<option value="${category}">${category}</option>`
        ).join("");
}


// =====================================
// 6. CALCULATE DASHBOARD TOTALS
// =====================================

function updateDashboard() {

    // filter() selects transactions of a particular type.
    // reduce() adds their amounts together.

    const totalIncome = transactions
        .filter(item => item.type === "income")
        .reduce((total, item) => total + item.amount, 0);

    const totalExpenses = transactions
        .filter(item => item.type === "expense")
        .reduce((total, item) => total + item.amount, 0);

    const balance = totalIncome - totalExpenses;

    balanceElement.textContent = formatCurrency(balance);
    incomeElement.textContent = formatCurrency(totalIncome);
    expensesElement.textContent = formatCurrency(totalExpenses);
}


// =====================================
// 7. SHOW SPENDING BREAKDOWN
// =====================================

function renderBreakdown() {

    const expenseTransactions = transactions.filter(
        item => item.type === "expense"
    );

    const totalExpenses = expenseTransactions.reduce(
        (total, item) => total + item.amount,
        0
    );

    // Group expenses by category.
    const categoryTotals = {};

    expenseTransactions.forEach(item => {
        if (!categoryTotals[item.category]) {
            categoryTotals[item.category] = 0;
        }

        categoryTotals[item.category] += item.amount;
    });

    // Convert the object into an array and sort it.
    const sortedCategories = Object.entries(categoryTotals)
        .sort((a, b) => b[1] - a[1]);

    if (sortedCategories.length === 0) {
        breakdownElement.innerHTML =
            '<p class="empty">Add an expense to see your report.</p>';
        return;
    }

    breakdownElement.innerHTML = sortedCategories.map(
        ([category, amount]) => {

            const percentage = totalExpenses > 0
                ? (amount / totalExpenses) * 100
                : 0;

            return `
                <div class="breakdown-item">

                    <div class="breakdown-heading">
                        <span>
                            ${categoryIcons[category]}
                            ${escapeHTML(category)}
                        </span>

                        <strong>${formatCurrency(amount)}</strong>
                    </div>

                    <div class="bar">
                        <div
                            class="bar-fill"
                            style="width: ${percentage}%">
                        </div>
                    </div>

                    <p class="percentage">
                        ${percentage.toFixed(1)}% of total expenses
                    </p>

                </div>
            `;
        }
    ).join("");
}


// =====================================
// 8. DISPLAY TRANSACTIONS
// =====================================

function renderTransactions() {

    const searchText = searchInput.value.trim().toLowerCase();
    const selectedCategory = categoryFilter.value;

    // Apply the selected tab, search text, and category filter.
    const filteredTransactions = transactions
        .filter(item =>
            activeTab === "all" || item.type === activeTab
        )
        .filter(item =>
            selectedCategory === "all" ||
            item.category === selectedCategory
        )
        .filter(item =>
            `${item.description} ${item.category}`
                .toLowerCase()
                .includes(searchText)
        )
        .sort((a, b) =>
            b.date.localeCompare(a.date) ||
            b.id.localeCompare(a.id)
        );

    if (filteredTransactions.length === 0) {
        transactionList.innerHTML = `
            <p class="empty">
                No transactions found.
                <br>
                Try adding a transaction or changing your filters.
            </p>
        `;

        return;
    }

    transactionList.innerHTML = filteredTransactions.map(item => {

        const isIncome = item.type === "income";

        const sign = isIncome ? "+" : "−";
        const color = isIncome ? "green" : "red";

        return `
            <div class="transaction">

                <div class="transaction-info">
                    <h3>
                        ${categoryIcons[item.category] || "📌"}
                        ${escapeHTML(item.description)}
                    </h3>

                    <p>
                        ${escapeHTML(item.category)}
                        · ${escapeHTML(item.date)}
                    </p>
                </div>

                <div class="transaction-right">

                    <div class="transaction-amount ${color}">
                        ${sign}${formatCurrency(item.amount)}
                    </div>

                    <div class="actions">
                        <button
                            type="button"
                            data-action="edit"
                            data-id="${escapeHTML(item.id)}">
                            Edit
                        </button>

                        <button
                            type="button"
                            data-action="delete"
                            data-id="${escapeHTML(item.id)}">
                            Delete
                        </button>
                    </div>

                </div>

            </div>
        `;
    }).join("");
}


// =====================================
// 9. RENDER THE WHOLE APPLICATION
// =====================================

function renderApp() {
    updateDashboard();
    renderBreakdown();
    renderTransactions();
}


// =====================================
// 10. ADD OR UPDATE TRANSACTION
// =====================================

form.addEventListener("submit", function (event) {

    // Prevent the page from refreshing.
    event.preventDefault();

    const id = transactionIdInput.value;

    const description = descriptionInput.value.trim();
    const amount = Number(amountInput.value);
    const type = typeInput.value;
    const category = categoryInput.value;
    const date = dateInput.value;

    // Validate form data.
    if (
        !description ||
        !Number.isFinite(amount) ||
        amount <= 0 ||
        amount > 1000000000 ||
        !categories.includes(category) ||
        !["income", "expense"].includes(type) ||
        !date ||
        !/^\d{4}-\d{2}-\d{2}$/.test(date)
    ) {
        messageElement.textContent =
            "Please enter valid transaction details.";
        return;
    }

    // Create a transaction object.
    const transaction = {
        id: id || generateId(),
        description: description,
        amount: amount,
        type: type,
        category: category,
        date: date
    };

    if (id) {

        // Update an existing transaction.
        transactions = transactions.map(item =>
            item.id === id ? transaction : item
        );

        messageElement.textContent = "Transaction updated!";

    } else {

        // Add a new transaction to the array.
        transactions.push(transaction);

        messageElement.textContent = "Transaction added!";
    }

    // Persist the data and refresh the UI.
    const saved = saveTransactions();

    renderApp();
    resetForm();

    if (saved) {
        messageElement.textContent = id
            ? "Transaction updated successfully!"
            : "Transaction added successfully!";
    }
});


// =====================================
// 11. EDIT OR DELETE TRANSACTIONS
// =====================================

// Event delegation: one listener handles all transaction buttons.
transactionList.addEventListener("click", function (event) {

    const button = event.target.closest("button[data-action]");

    if (!button) {
        return;
    }

    const id = button.dataset.id;

    const transaction = transactions.find(
        item => item.id === id
    );

    if (!transaction) {
        return;
    }

    if (button.dataset.action === "edit") {

        // Fill the form with the selected transaction.
        transactionIdInput.value = transaction.id;
        descriptionInput.value = transaction.description;
        amountInput.value = transaction.amount;
        typeInput.value = transaction.type;
        categoryInput.value = transaction.category;
        dateInput.value = transaction.date;

        document.getElementById("formTitle").textContent =
            "Edit Transaction";

        submitBtn.textContent = "Save Changes";
        cancelBtn.classList.remove("hidden");

        messageElement.textContent =
            "Editing: " + transaction.description;

        descriptionInput.focus();

    } else if (button.dataset.action === "delete") {

        // Ask for confirmation before deleting.
        const confirmed = confirm(
            `Delete "${transaction.description}"?`
        );

        if (!confirmed) {
            return;
        }

        transactions = transactions.filter(
            item => item.id !== id
        );

        saveTransactions();

        // If the deleted transaction was being edited, reset the form.
        if (transactionIdInput.value === id) {
            resetForm();
        }

        renderApp();
        messageElement.textContent = "Transaction deleted.";
    }
});


// =====================================
// 12. RESET THE FORM
// =====================================

function resetForm() {

    form.reset();

    transactionIdInput.value = "";
    dateInput.value = getToday();

    document.getElementById("formTitle").textContent =
        "Add Transaction";

    submitBtn.textContent = "+ Add Transaction";
    cancelBtn.classList.add("hidden");
}

cancelBtn.addEventListener("click", resetForm);


// =====================================
// 13. SEARCH TRANSACTIONS
// =====================================

searchInput.addEventListener("input", function () {

    // Re-render the list whenever the user types.
    renderTransactions();
});


// =====================================
// 14. FILTER BY CATEGORY
// =====================================

categoryFilter.addEventListener("change", function () {
    renderTransactions();
});


// =====================================
// 15. FILTER BY TRANSACTION TYPE
// =====================================

document.querySelectorAll(".tab").forEach(button => {

    button.addEventListener("click", function () {

        // Remember which tab is selected.
        activeTab = button.dataset.type;

        // Update the active tab styling.
        document.querySelectorAll(".tab").forEach(tab => {
            tab.classList.toggle("active", tab === button);
        });

        renderTransactions();
    });
});


// =====================================
// 16. EXPORT TRANSACTIONS TO CSV
// =====================================

document.getElementById("exportBtn").addEventListener(
    "click",
    function () {

        const rows = [
            ["Description", "Type", "Category", "Amount", "Date"],

            ...transactions.map(item => [
                item.description,
                item.type,
                item.category,
                item.amount.toFixed(2),
                item.date
            ])
        ];

        // Escape quotes so descriptions work correctly in CSV.
        const csv = rows.map(row =>
            row.map(value =>
                '"' + String(value).replace(/"/g, '""') + '"'
            ).join(",")
        ).join("\r\n");

        // Create a downloadable CSV file.
        const blob = new Blob(
            ["\uFEFF" + csv],
            { type: "text/csv;charset=utf-8;" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "expense-tracker.csv";

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);
    }
);


// =====================================
// 17. START THE APPLICATION
// =====================================

initializeCategories();
loadTransactions();

dateInput.value = getToday();

renderApp();

    </script>
</body>
</html>
