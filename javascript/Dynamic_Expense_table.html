
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Management</title>

    <style>
        /* CSS selector: element selector */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        /* CSS selector: class selector */
        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #00000010;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .expense-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        /* CSS selector: element selector */
        input, select, button {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
        }

        /* CSS selector: ID selector */
        #addBtn {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        #addBtn:hover {
            background: #1d4ed8;
        }

        .summary {
            background: #dbeafe;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .summary h2 {
            margin: 0;
            color: #1d4ed8;
        }

        .filter {
            margin-bottom: 15px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #eff6ff;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            cursor: pointer;
            width: auto;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        #emptyMessage {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .expense-form {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Expense Management</h1>

    <!-- Expense form -->
    <form id="expenseForm" class="expense-form">

        <input
            type="text"
            id="description"
            placeholder="Expense description"
            required
        >

        <input
            type="number"
            id="amount"
            placeholder="Amount (₹)"
            min="0.01"
            step="0.01"
            required
        >

        <select id="category" required>
            <option value="">Select category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
        </select>

        <input type="date" id="date" required>

        <button type="submit" id="addBtn">
            + Add Expense
        </button>

    </form>

    <!-- Total expense summary -->
    <div class="summary">
        <h2>Total Expenses: ₹<span id="total">0.00</span></h2>
        <p id="expenseCount">Total records: 0</p>
    </div>

    <!-- Filter expenses -->
    <div class="filter">
        <label for="filterCategory">Filter by category:</label>

        <select id="filterCategory">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <!-- Dynamic expense table -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseTable">
                <!-- JavaScript adds rows here -->
            </tbody>
        </table>
    </div>

    <p id="emptyMessage">No expenses added yet.</p>

</div>

<script>
    // =====================================
    // 1. SELECT ELEMENTS USING DOM SELECTORS
    // =====================================

    // Select by ID using getElementById()
    const expenseForm = document.getElementById("expenseForm");
    const descriptionInput = document.getElementById("description");
    const amountInput = document.getElementById("amount");
    const categoryInput = document.getElementById("category");
    const dateInput = document.getElementById("date");

    const expenseTable = document.getElementById("expenseTable");
    const totalElement = document.getElementById("total");
    const expenseCount = document.getElementById("expenseCount");
    const filterCategory = document.getElementById("filterCategory");
    const emptyMessage = document.getElementById("emptyMessage");

    // Store expenses in an array
    const expenses = [];

    // Set today's date as the default date
    dateInput.value = new Date().toLocaleDateString("en-CA");

    // =====================================
    // 2. HANDLE FORM SUBMISSION EVENT
    // =====================================

    expenseForm.addEventListener("submit", function(event) {

        // Prevent the browser from refreshing the page
        event.preventDefault();

        // Get values from the input fields
        const description = descriptionInput.value.trim();
        const amount = Number(amountInput.value);
        const category = categoryInput.value;
        const date = dateInput.value;

        // Validate the input values
        if (
            description === "" ||
            !Number.isFinite(amount) ||
            amount <= 0 ||
            category === "" ||
            date === ""
        ) {
            alert("Please enter valid expense details.");
            return;
        }

        // Create a new expense object
        const expense = {
            id: Date.now() + Math.random(),
            description: description,
            amount: amount,
            category: category,
            date: date
        };

        // Add the expense object to the array
        expenses.push(expense);

        // Update the table and total
        renderExpenses();

        // Clear the form after adding
        expenseForm.reset();

        // Set today's date again
        dateInput.value = new Date().toLocaleDateString("en-CA");
    });

    // =====================================
    // 3. DISPLAY DATA USING DOM MANIPULATION
    // =====================================

    function renderExpenses() {

        // Read the selected category
        const selectedCategory = filterCategory.value;

        // Filter the array using filter()
        const filteredExpenses = expenses.filter(function(expense) {
            return selectedCategory === "All" ||
                   expense.category === selectedCategory;
        });

        // Remove previously displayed rows
        expenseTable.replaceChildren();

        // Create a table row for each filtered expense
        filteredExpenses.forEach(function(expense) {

            const row = document.createElement("tr");

            // Helper function: create a safe text cell
            function createCell(value) {
                const cell = document.createElement("td");
                cell.textContent = value;
                return cell;
            }

            // Create cells using DOM methods
            row.appendChild(createCell(expense.description));

            row.appendChild(
                createCell("₹" + expense.amount.toFixed(2))
            );

            row.appendChild(createCell(expense.category));
            row.appendChild(createCell(expense.date));

            // Create the delete button
            const actionCell = document.createElement("td");
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.type = "button";
            deleteButton.dataset.id = String(expense.id);

            actionCell.appendChild(deleteButton);
            row.appendChild(actionCell);

            // Add the completed row to the table
            expenseTable.appendChild(row);
        });

        // Calculate total of ALL expenses, not just filtered rows
        const total = expenses.reduce(function(sum, expense) {
            return sum + expense.amount;
        }, 0);

        totalElement.textContent = total.toFixed(2);
        expenseCount.textContent = "Total records: " + expenses.length;

        // Show the empty message when there are no matching rows
        emptyMessage.hidden = filteredExpenses.length > 0;
    }

    // =====================================
    // 4. HANDLE DELETE CLICK EVENT
    // =====================================

    // Event delegation: listen on the table body
    expenseTable.addEventListener("click", function(event) {

        // Check whether the clicked element is a delete button
        if (!event.target.matches(".delete-btn")) {
            return;
        }

        // Get the ID from the button's data attribute
        const expenseId = Number(event.target.dataset.id);

        // Find the expense in the array
        const index = expenses.findIndex(function(expense) {
            return expense.id === expenseId;
        });

        // Delete the expense if it exists
        if (index !== -1) {
            expenses.splice(index, 1);

            // Refresh the table and recalculate the total
            renderExpenses();
        }
    });

    // =====================================
    // 5. HANDLE CATEGORY FILTER EVENT
    // =====================================

    filterCategory.addEventListener("change", function() {

        // Re-render the table when the filter changes
        renderExpenses();
    });

    // Initial display
    renderExpenses();

</script>

</body>
</html>
